# Local development only. DEV/HML/PRD environments are owned by infra; do not use this file for them.
#
#   docker compose up -d                 Postgres + MinIO (run the apps with `npm run dev`)
#   docker compose --profile app up -d   also builds and runs the app container (website + CMS at /admin)
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digio}
      POSTGRES_DB: ${POSTGRES_DB:-digio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-digio} -d ${POSTGRES_DB:-digio}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '${MINIO_API_PORT:-9200}:9000'
      - '${MINIO_CONSOLE_PORT:-9201}:9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the media bucket on first start and makes it publicly readable,
  # since the website loads images straight from storage (not through the CMS).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-digio-media}

  # Local identity provider standing in for the corporate RH-SSO (Red Hat build of Keycloak).
  # Realm, client and test users: docker/keycloak/digio-realm.json (dev only, test passwords).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: start-dev --import-realm
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Issuer seen by both the browser and the CMS (http://localhost:<port>/realms/digio).
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 && grep -q UP <&3',
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  # Site + CMS (/admin) in a single container, built from the root Dockerfile.
  app:
    profiles: [app]
    build:
      context: .
      args:
        NEXT_PUBLIC_CMS_URL: http://localhost:${APP_PORT:-3000}
        NEXT_PUBLIC_WEB_URL: http://localhost:${APP_PORT:-3000}
        NEXT_PUBLIC_MEDIA_URL: http://localhost:${MINIO_API_PORT:-9200}/${S3_BUCKET:-digio-media}
        IMAGES_ALLOW_LOCAL_IP: 'true'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file: .env
    environment:
      # Container-to-container addresses override the localhost ones from .env.
      DATABASE_URL: postgres://${POSTGRES_USER:-digio}:${POSTGRES_PASSWORD:-digio}@postgres:5432/${POSTGRES_DB:-digio}
      S3_ENDPOINT: http://minio:9000
      SERVER_URL: http://localhost:${APP_PORT:-3000}
      WEB_URL: http://localhost:${APP_PORT:-3000}
      WEB_INTERNAL_URL: http://localhost:3000
      # SSO needs one issuer URL reachable by both the browser and the app; inside this
      # container localhost:8080 is not Keycloak. Test SSO with `npm run dev` instead.
      AUTH_SSO_ENABLED: 'false'

volumes:
  postgres-data:
  minio-data:
